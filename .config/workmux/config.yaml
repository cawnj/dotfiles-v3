nerdfont: true

# override system prompt with serena's to counteract tool bias
agent: 'claude --system-prompt="$(serena prompts print-cc-system-prompt-override)"'

# disable automatic tmux format modification
status_format: false

panes:
  - command: workmux sandbox agent
  - split: horizontal
    focus: true

files:
  symlink:
    - .claude/settings.local.json
    - .serena/project.yml
    - .serena/project.local.yml
    - .serena/memories
    - devbox.json
    - docs/superpowers

sandbox:
  enabled: true
  backend: lima
  toolchain: devbox
  agent_config_dir: ~/.sandbox-config/{agent}
  env_passthrough:
    - GITHUB_PACKAGES_TOKEN
    - NODE_AUTH_TOKEN
    - CONTEXT7_API_KEY
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    UseSharedCompilation: "false"  # disable Roslyn compile server
  extra_mounts:
    - host_path: ~/.config/workmux
      guest_path: /opt/workmux
  lima:
    memory: 4GiB
    provision: |
      # add nix to login shell's PATH
      echo 'export PATH="/nix/var/nix/profiles/default/bin:$PATH"' >> ~/.bashrc

      # install configs
      install -D /opt/workmux/sandbox.fish ~/.config/fish/config.fish
      install -D /opt/workmux/sandbox.gitconfig ~/.gitconfig

      # install mcp tools
      export PATH="$HOME/.local/bin:/nix/var/nix/profiles/default/bin:$PATH"
      nix profile install nixpkgs#uv
      uv tool install -p 3.13 serena-agent
      uv tool install "graphifyy[mcp]"
