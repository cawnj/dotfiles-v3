nerdfont: true

# override system prompt with serena's to counteract tool bias
agent: 'claude --system-prompt="$(serena prompts print-cc-system-prompt-override)"'

# disable automatic tmux format modification
status_format: false

panes:
  - command: workmux sandbox agent
  - split: horizontal
    focus: true

post_create:
  # pre-warm Serena's per-worktree symbol cache so the first C# op doesn't trigger a full Roslyn index
  - nohup serena project index >/dev/null 2>&1 &
  # a teammate committed files under docs/superpowers (my cross-worktree symlink target); the checkout
  # materializes them and clobbers the symlink. skip-worktree stops git tracking them in this worktree
  # (keeps `git status` clean), then re-point the symlink at the main worktree's shared store.
  - git ls-files docs/superpowers | xargs -r git update-index --skip-worktree && rm -rf docs/superpowers && ln -sfn ../../../bl-platform/docs/superpowers docs/superpowers

files:
  symlink:
    - .claude/settings.local.json
    - .serena/project.yml
    - .serena/project.local.yml
    - .serena/memories
    - devbox.json
    - docs/superpowers

sandbox:
  enabled: true
  backend: lima
  toolchain: devbox
  agent_config_dir: ~/.sandbox-config/{agent}
  env_passthrough:
    - GITHUB_PACKAGES_TOKEN
    - NODE_AUTH_TOKEN
    - CONTEXT7_API_KEY
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    UseSharedCompilation: "false"  # disable Roslyn compile server
  extra_mounts:
    - host_path: ~/.config/workmux
      guest_path: /opt/workmux
  lima:
    memory: 8GiB
    provision: |
      # 4GiB swapfile so memory reclaim has somewhere to spill instead of thrashing kswapd0
      if [ ! -f /swapfile ]; then
        sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
      fi

      # add nix to login shell's PATH
      echo 'export PATH="/nix/var/nix/profiles/default/bin:$PATH"' >> ~/.bashrc

      # install configs
      install -D /opt/workmux/sandbox.fish ~/.config/fish/config.fish
      install -D /opt/workmux/sandbox.gitconfig ~/.gitconfig

      # install mcp tools
      export PATH="$HOME/.local/bin:/nix/var/nix/profiles/default/bin:$PATH"
      nix profile install nixpkgs#uv
      uv tool install -p 3.13 serena-agent
      uv tool install "graphifyy[mcp]"
