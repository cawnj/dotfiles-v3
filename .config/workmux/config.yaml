nerdfont: true

agent: claude

# disable automatic tmux format modification
status_format: false

panes:
  - command: <agent>
  - split: horizontal
    focus: true

post_create:
  # Point this worktree's docs/superpowers at the shared Obsidian vault store (flat, all repos).
  # 1) skip-worktree any tracked files there (e.g. bl-platform) so they don't show in `git status`;
  # 2) add docs/superpowers to this repo's local exclude so the untracked symlink stays clean too;
  # 3) replace whatever's there with an absolute symlink to the vault.
  - mkdir -p "$HOME/Documents/notes/superpowers" && git ls-files docs/superpowers | xargs -r git update-index --skip-worktree; EX="$(git rev-parse --git-path info/exclude)"; grep -qxF docs/superpowers "$EX" 2>/dev/null || echo docs/superpowers >> "$EX"; rm -rf docs/superpowers && mkdir -p docs && ln -sfn "$HOME/Documents/notes/superpowers" docs/superpowers

files:
  symlink:
    - .claude/settings.local.json
    - devbox.json
